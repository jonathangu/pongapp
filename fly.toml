app = "pongapp-room"
primary_region = "sjc"

[build]
  dockerfile = "apps/room-server/Dockerfile"

[env]
  PORT = "8080"
  ROOM_DATA_PATH = "/data/rooms.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "pongapp_room_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
