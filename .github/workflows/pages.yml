name: Verify and deploy PongApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          VITE_ROOM_SERVER_URL: ${{ vars.ROOM_SERVER_URL }}
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify canonical production assets
        run: node scripts/production-smoke.mjs
        env:
          DEPLOYMENT_ID: ${{ github.sha }}
          PONGAPP_SITE_URL: https://www.jonathangu.com/pongapp/
          ROOM_SERVER_URL: https://pongapp-room.pongapp-room-worker.workers.dev
      - name: Verify authoritative production multiplayer
        run: node scripts/room-smoke.mjs
        env:
          ROOM_SERVER_URL: https://pongapp-room.pongapp-room-worker.workers.dev
      - name: Verify authoritative production versus
        run: node scripts/room-smoke.mjs
        env:
          GAME_MODE: versus
          ROOM_SERVER_URL: https://pongapp-room.pongapp-room-worker.workers.dev
